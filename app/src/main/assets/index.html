<script>
    let classifier;

    Module.onRuntimeInitialized = async function() {
        classifier = await createClassifier();
        window.Android.modelReady();
    };

    function classifyData(features) {
        const result = classifier.classify(features);
        return JSON.stringify(result);
    }
